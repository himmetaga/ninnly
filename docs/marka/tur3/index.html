<!doctype html>
<html lang="tr">
<head>

<title>Ninnly vektör ikonlar</title>

</head>
<body>
<div class="w">

  <p class="s">Vektör çizim: her boyutta keskin. Büyük, ana ekran (60 px) ve ayarlar (29 px) boyutları.</p>
  <div class="g">
    <div class="c"><div class="row"><img class="b" src="07-sut-damlasi.svg"><div><img class="m" src="07-sut-damlasi.svg"><div style="height:12px"></div><img class="t" src="07-sut-damlasi.svg"></div></div><div class="cap">7 · süt damlası</div></div>

    <div class="c"><div class="row"><img class="b" src="08-ninni-notasi.svg"><div><img class="m" src="08-ninni-notasi.svg"><div style="height:12px"></div><img class="t" src="08-ninni-notasi.svg"></div></div><div class="cap">8 · ninni notası</div></div>
  </div>
</div>
</body>
</html>
